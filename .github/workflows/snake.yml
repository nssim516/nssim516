name: generate animation

on:
  # run automatically every 24 hours
  schedule:
    - cron: "0 */24 * * *" 
  
  # allows to manually run the job at any time
  workflow_dispatch:
  
  # run on every push on the master branch
  push:
    branches:
    - main
    
  

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # generates a snake game from a github user (<github_user_name>) contributions graph, output a svg animation at <svg_out_path>
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # muted rose and lavender, based on nissiotoo.com
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#B07AA1&color_dots=#ebedf0,#E8D5E3,#CDB4D6,#A88FC6,#7A68A0
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#D9B8CF&color_dots=#161b22,#3A3350,#554A75,#7A68A0,#A88FC6

      # the snake walks one row outside the grid when it moves between targets;
      # crop each svg to the grid itself so it never shows outside its map
      - name: keep the snake inside its grid
        run: |
          sudo python3 - <<'EOF'
          import glob, re
          for path in glob.glob("dist/*.svg"):
              svg = open(path).read()
              cells = re.findall(r'<rect class="c[^"]*" x="([\d.]+)" y="([\d.]+)"', svg)
              xs = [float(x) for x, _ in cells]
              ys = [float(y) for _, y in cells]
              x0, y0 = min(xs) - 2, min(ys) - 2
              w, h = max(xs) + 14 - x0, max(ys) + 14 - y0
              svg = re.sub(r'<svg viewBox="[^"]*" width="[^"]*" height="[^"]*"',
                           f'<svg viewBox="{x0:g} {y0:g} {w:g} {h:g}" width="{w:g}" height="{h:g}"',
                           svg, count=1)
              open(path, "w").write(svg)
              print(f"{path}: cropped to {w:g}x{h:g}")
          EOF

      # push the content of <build_dir> to a branch
      # the content will be available at https://raw.githubusercontent.com/<github_user>/<repository>/<target_branch>/<file> , or as github page
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
