<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 170" width="880" height="170" role="img" aria-label="Hi, I'm Nissi!">
  <defs>
    <linearGradient id="text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F6BBF6"/>
      <stop offset="100%" stop-color="#8A4FF0"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F6BBF6"/>
      <stop offset="100%" stop-color="#8A4FF0"/>
    </linearGradient>
    <radialGradient id="glowPink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#F6BBF6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F6BBF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#8A4FF0" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#8A4FF0" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="880" height="170" rx="18"/></clipPath>
    <style>
      .glow { animation: drift 9s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
      .glow.b { animation-duration: 11s; animation-direction: alternate-reverse; }
      @keyframes drift { from { transform: translateX(-40px) scale(1); } to { transform: translateX(40px) scale(1.15); } }
      .wave { animation: wave 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: 70% 80%; }
      @keyframes wave { 0%, 60%, 100% { transform: rotate(0deg); } 10%, 30% { transform: rotate(14deg); } 20%, 40% { transform: rotate(-8deg); } }
      @media (prefers-reduced-motion: reduce) { .glow, .wave { animation: none; } }
    </style>
  </defs>
  <g clip-path="url(#card)">
    <rect width="880" height="170" fill="#1E2939"/>
    <ellipse class="glow" cx="170" cy="40" rx="260" ry="150" fill="url(#glowPink)"/>
    <ellipse class="glow b" cx="720" cy="140" rx="280" ry="160" fill="url(#glowPurple)"/>
    <rect y="164" width="880" height="6" fill="url(#edge)"/>
  </g>
  <text x="410" y="100" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="56" font-weight="800" fill="url(#text)">Hi, I'm Nissi!</text>
  <text class="wave" x="596" y="98" font-size="46" font-family="'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif">👋</text>
</svg>
